<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Video... | KamaBaba</title>
  <meta name="robots" content="index, follow">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="container header-inner">
      <a href="index.html" class="logo">Kama<span>Baba</span></a>
      <nav>
        <a href="index.html">← Back to Home</a>
      </nav>
    </div>
  </header>

  <main class="container player-page">
    <div id="playerLoading" class="loading">Loading video...</div>
    
    <div id="playerContent" style="display:none;">
      <h1 id="videoTitle"></h1>
      
      <div class="player-wrapper">
        <div id="videoPlayer" class="video-player">
          <!-- Player will be injected here -->
        </div>
      </div>

      <div class="video-meta">
        <p id="videoExcerpt"></p>
        <div class="tags" id="videoTags"></div>
        <a id="originalLink" href="#" target="_blank" rel="noopener" class="btn">Watch on Original Site →</a>
      </div>

      <section class="related">
        <h2>More Videos</h2>
        <div id="relatedGrid" class="video-grid"></div>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>© 2026 KamaBaba Mirror</p>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    // Force load single video
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof loadSingleVideo === 'function') loadSingleVideo();
    });
  </script>
</body>
</html>
